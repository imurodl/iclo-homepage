name: AWS Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  cicd:
    runs-on: ubuntu-latest

    steps:
      # 1. Git 저장소 클론
      - uses: actions/checkout@v3

      # 2. Node.js 설정
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      # 3. 의존성 설치
      - name: Install dependencies
        run: npm install

      # 4. 빌드 생성
      - name: Build project with environment variables
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SOLAPI_API_KEY: ${{ secrets.VITE_SOLAPI_API_KEY }}
          VITE_SOLAPI_API_SECRET: ${{ secrets.VITE_SOLAPI_API_SECRET }}
          VITE_SOLAPI_FROM_NUMBER: ${{ secrets.VITE_SOLAPI_FROM_NUMBER }}
          VITE_SOLAPI_PROFILE_KEY: ${{ secrets.VITE_SOLAPI_PROFILE_KEY }}
          VITE_ALIMTALK_PATIENT_WELCOME_TEMPLATE: ${{ secrets.VITE_ALIMTALK_PATIENT_WELCOME_TEMPLATE }}
          VITE_ALIMTALK_REFERRER_THANKS_TEMPLATE: ${{ secrets.VITE_ALIMTALK_REFERRER_THANKS_TEMPLATE }}
          

      # 5. AWS CLI 버전 확인
      - name: Check AWS CLI version
        run: aws --version

      # 6. AWS 자격 증명 설정
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1 
        with: 
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }} 
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      # 7. S3로 업로드 (빌드 디렉토리를 ./dist로 변경)
      - name: Upload to S3
        run: |
          aws s3 sync \
            ./dist s3://${{ secrets.AWS_S3_BUCKET }}
    
      # 8. CloudFront 캐시 무효화
      - name: CloudFront Invalidation
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.AWS_CLOUDFRONT_ID }} --paths "/*"
